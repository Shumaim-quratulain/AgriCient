spring.application.name=backend
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agricient}
spring.datasource.username=${DB_USER:agricient}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}

# SMS: "log" (default) only simulates and sends nothing; "twilio" sends real texts
sms.provider=${SMS_PROVIDER:log}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}
twilio.from=${TWILIO_FROM:}
# Twilio trial accounts only allow their own templates. Set this (for example sms_account_alerts) while on a trial; leave empty after upgrading.
twilio.trial-template=${TWILIO_TRIAL_TEMPLATE:}

# send the reason of an error (for example "No account found") to the page, never a stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Web Push (notifications that reach the phone even when the page is closed). Leave the keys empty to switch it off.
push.public-key=${PUSH_PUBLIC_KEY:}
push.private-key=${PUSH_PRIVATE_KEY:}
push.subject=${PUSH_SUBJECT:mailto:admin@example.com}

# Officers register themselves by typing this code. Leave empty to switch officer sign-up off.
officer.invite-code=${OFFICER_INVITE_CODE:}

# Behind a load balancer or reverse proxy the real client address and HTTPS come in headers; trust them.
server.forward-headers-strategy=framework
server.port=${PORT:8080}
# stop the server cleanly so a running alert check can finish
server.shutdown=graceful

